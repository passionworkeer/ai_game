# Android 项目构建配置
android.useAndroidX=true
# Disable KSP incremental to avoid Windows incremental-cache corruption
ksp.incremental=false

# 自定义缓存目录（移到 E 盘，避免 C 盘满载）
systemProp.gradle.user.home=E:/.gradle
org.gradle.daemon=false
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED
org.gradle.caching=true

# Android SDK 路径（使用 D 盘已有的 SDK）
android.sdk.dir=D:/android-sdk
org.gradle.java.home=D:/java/jdk-17.0.9

# AVD 路径（E 盘）
android.avd.home=E:/.android/avd

# Gradle 全局代理（解决国内网络超时）

# 禁用 Gradle 的 build cache 避免 Windows 文件锁定问题
org.gradle.caching=false
kotlin.daemon.enabled=false
